version: "3.8"

services:
  bridge-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agv_bridge_server
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "3001:3001"
    env_file:
      - .env
    networks:
      - agv_network

  dashboard-ui:
    image: nginx:alpine
    container_name: agv_dashboard_ui
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./public:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - agv_network
    depends_on:
      - bridge-server

networks:
  agv_network:
    driver: bridge
